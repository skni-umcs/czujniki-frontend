stages:
  - install
  - build
  - build_docker
  - deploy

install_dependencies:
  stage: install
  image: node
  when: manual
  script:
    - corepack enable
    - corepack prepare pnpm@latest-10 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - node_modules/
      - .pnpm-store/

build:
  stage: build
  image: node
  when: manual
  needs: ["install_dependencies"]
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

docker_build:
  stage: build_docker
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --cache-from "$CI_REGISTRY_IMAGE:latest" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  only:
    - master
    - test-ci

deploy:
  stage: deploy
  trigger:
    project: "czujniki/infra"
    branch: "main"
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    FRONTEND_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH"
  only:
    - main
    - master