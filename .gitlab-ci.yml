stages:
  - install
  # - test
  - build
  # - deploy

# Define caching strategy to speed up subsequent jobs
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

# Base job template
default:
  image: node # Use a Node.js image compatible with pnpm
  before_script:
    - corepack enable
    - pnpm install # Installs dependencies with pnpm using the cache

# Install dependencies
install:
  stage: install
  script:
    - pnpm install
  artifacts:
    paths:
      - node_modules # Cache node_modules for faster builds
  cache:
    paths:
      - .pnpm-store

