stages:
  - install
  - build
  - build_docker
  - deploy


cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .pnpm-store/

install_dependencies:
  before_script:
  - corepack enable pnpm
  - pnpm config set store-dir .pnpm-store
  stage: install
  image: node
  script:
    - pnpm install

build:
  before_script:
  - corepack enable pnpm
  - pnpm config set store-dir .pnpm-store
  stage: build
  image: node
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

docker_build:
  stage: build_docker
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH" $CI_REGISTRY_IMAGE:latest
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH"
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master


deploy:
  # image: alpine:latest
  stage: deploy
  trigger:
    project: "czujniki/infra"
    branch: "main"
    strategy: depend
    forward:
      pipeline_variables: true
  variables:
    FRONTEND_IMAGE_TAG: "$CI_COMMIT_SHORT_SHA-$CI_COMMIT_BRANCH"
  only:
    - main
    - master

